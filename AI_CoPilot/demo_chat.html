<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Energix — Grok AI Warehouse Co-Pilot</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #080e18;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      color: #00d26a;
      margin: 0;
      font-size: 28px;
    }
    .header p {
      color: #94a3b8;
      margin-top: 5px;
    }
    .chat-card {
      width: 420px;
      height: 580px;
      background: #0d1522;
      border: 1px solid #1e293b;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .card-top {
      padding: 16px 20px;
      background: #141f32;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      background: rgba(0, 210, 106, 0.15);
      color: #00d26a;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .messages-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
    }
    .msg.bot {
      background: #1a273e;
      color: #e2e8f0;
      align-self: flex-start;
      border-bottom-right-radius: 4px;
    }
    .msg.user {
      background: #00d26a;
      color: #05140b;
      font-weight: bold;
      align-self: flex-end;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      padding: 14px;
      background: #141f32;
      border-top: 1px solid #1e293b;
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 12px 14px;
      background: #090f1a;
      border: 1px solid #2d3b55;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .input-area button {
      background: #00d26a;
      color: #05140b;
      border: none;
      padding: 0 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .input-area button:hover {
      background: #00b85c;
    }
    .quick-chips {
      padding: 8px 16px;
      background: #0d1522;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-top: 1px solid #162235;
    }
    .chip {
      background: #1a273e;
      border: 1px solid #2d3b55;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:hover {
      color: #00d26a;
      border-color: #00d26a;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚡ Energix Smart Warehouse</h1>
    <p>Grok AI Co-Pilot & IoT Lighting Control</p>
  </div>

  <div class="chat-card">
    <div class="card-top">
      <div style="font-weight: bold; display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 18px;">🤖</span> Grok Co-Pilot
      </div>
      <div class="badge">Online (xAI Grok)</div>
    </div>

    <div class="messages-container" id="chat-messages">
      <div class="msg bot">
        أهلاً بك! أنا <b>Grok Co-Pilot</b>، مساعد إدارة طاقة المخزن. يمكنك أن تطلب مني مراقبة الاستهلاك أو التحكم في إضاءة الممرات وتفعيل أوضاع الصيانة.
      </div>
    </div>

    <div class="quick-chips">
      <div class="chip" onclick="quickSend('تقرير الاستهلاك والتوفير')">📊 تقرير الاستهلاك</div>
      <div class="chip" onclick="quickSend('اطفي ممر 1 للصيانة')">🛑 اطفي ممر 1</div>
      <div class="chip" onclick="quickSend('شغل ممر 1 بنسبة 100%')">💡 شغل ممر 1</div>
      <div class="chip" onclick="quickSend('رجع الإضاءة للوضع التلقائي')">🔄 الوضع التلقائي</div>
    </div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="اكتب أمرك هنا..." onkeypress="if(event.key === 'Enter') sendMessage()">
      <button onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    function quickSend(text) {
      document.getElementById('user-input').value = text;
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      const container = document.getElementById('chat-messages');
      container.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      container.scrollTop = container.scrollHeight;

      // Loading bubble
      const loadingId = 'loading-' + Date.now();
      container.innerHTML += `<div class="msg bot" id="${loadingId}">... جاري المعالجة عبر Grok</div>`;
      container.scrollTop = container.scrollHeight;

      try {
        const response = await fetch('http://localhost:8000/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        document.getElementById(loadingId).innerText = data.reply;
      } catch (err) {
        document.getElementById(loadingId).innerText = '⚠️ تعذر الاتصال بسيرفر Grok (تأكد من تشغيل grok_copilot.py على المنفذ 8000).';
        document.getElementById(loadingId).style.color = '#ef4444';
      }
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
